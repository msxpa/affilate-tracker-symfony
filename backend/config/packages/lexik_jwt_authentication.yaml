#affiliate-tracker-symfony/backend/config/packages/lexik_jwt_authentication.yaml

lexik_jwt_authentication:
    secret_key:       '%env(resolve:JWT_SECRET_KEY)%'
    public_key:       '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase:      '%env(JWT_PASSPHRASE)%'
    token_ttl:        3600        # 1 час
    user_id_claim:    email
    # user_identity_field: email #error?


    # Извлекаем токен из заголовка Authorization: Bearer <token>
    token_extractors:
        authorization_header:
            enabled: true
            prefix:  Bearer
            name:    Authorization
        cookie:
            enabled: false
        query_parameter:
            enabled: false

