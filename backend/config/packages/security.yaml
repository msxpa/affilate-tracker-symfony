#affiliate-tracker-symfony/backend/config/packages/security.yaml

security:
    # Хеширование паролей
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
            algorithm: 'auto'
            cost: 12

    # Провайдер пользователей — Doctrine
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # --- API: JWT ---
        # api:
        #     pattern: ^/api
        #     stateless: true
        #     provider: app_user_provider
        #     jwt: ~

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            # json_login:
            #     # check_path: /api/auth/login
            #     check_path: api_auth_login   # <-- имя роута
            #     username_path: email
            #     password_path: password
            #     success_handler: lexik_jwt_authentication.handler.authentication_success
            #     failure_handler: lexik_jwt_authentication.handler.authentication_failure
            jwt: ~

        # --- Публичный трекер: без аутентификации ---
        tracker:
            pattern: ^/(click|postback|redirect)
            stateless: true
            security: false

        main:
            lazy: true
            provider: app_user_provider

    # Иерархия ролей
    role_hierarchy:
        ROLE_ADMIN:       [ROLE_AFFILIATE]
        ROLE_SUPER_ADMIN: [ROLE_ADMIN]

    # Правила доступа
    access_control:
        # Публичные эндпоинты
        - { path: ^/api/auth/(login|register)$, roles: PUBLIC_ACCESS }
        - { path: ^/api/doc, roles: PUBLIC_ACCESS }
        - { path: ^/api$, roles: PUBLIC_ACCESS }
        - { path: ^/api/admin, roles: ROLE_ADMIN }

        # Админские
        - { path: ^/api/admin, roles: ROLE_ADMIN }

        # Кабинет веба
        - { path: ^/api/affiliate, roles: ROLE_AFFILIATE }

        # Всё остальное в /api — требует аутентификации
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # В тестах — быстрый хеш
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: 'auto'
                cost: 4

