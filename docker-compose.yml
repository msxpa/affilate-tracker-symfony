services:
  # ==========================================
  # RoadRunner HTTP Application Server
  # ==========================================
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: tracker_app
    working_dir: /var/www/html
    command: ["rr", "serve", "-c", ".rr.yaml"]
    restart: unless-stopped

    ports:
      - "80:8080"

    volumes:
      - ./backend:/var/www/html

    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_RUNTIME: "Runtime\\RoadRunnerSymfonyNyholm\\Runtime"

      DATABASE_URL: "postgresql://tracker:secret@database:5432/tracker?serverVersion=15&charset=utf8"
      REDIS_URL: "redis://redis:6379"
      MESSENGER_TRANSPORT_DSN: "amqp://tracker:secret@rabbitmq:5672/%2f"

    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy

    networks:
      - app-network

  # ==========================================
  # Symfony Messenger Worker
  # ==========================================
  worker:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: tracker_worker
    working_dir: /var/www/html

    command:
      - php
      - bin/console
      - messenger:consume
      - async
      - --time-limit=3600
      - --memory-limit=256M
      - -vv

    restart: unless-stopped

    volumes:
      - ./backend:/var/www/html

    environment:
      APP_ENV: prod
      APP_DEBUG: "0"

      DATABASE_URL: "postgresql://tracker:secret@database:5432/tracker?serverVersion=15&charset=utf8"
      REDIS_URL: "redis://redis:6379"
      MESSENGER_TRANSPORT_DSN: "amqp://tracker:secret@rabbitmq:5672/%2f"

    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy

    networks:
      - app-network

  # ==========================================
  # PostgreSQL
  # ==========================================
  database:
    image: postgres:15-alpine
    container_name: tracker_database
    restart: unless-stopped

    environment:
      POSTGRES_DB: tracker
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: secret

    ports:
      - "5432:5432"

    volumes:
      - ./docker/volumes/postgres:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - app-network

  # ==========================================
  # Redis
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: tracker_redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - ./docker/volumes/redis:/data

    command: redis-server --appendonly yes

    networks:
      - app-network

  # ==========================================
  # RabbitMQ
  # ==========================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: tracker_rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: tracker
      RABBITMQ_DEFAULT_PASS: secret

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq/mnesia
      - ./docker/volumes/rabbitmq-tracing:/var/tmp/rabbitmq-tracing

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

    networks:
      - app-network

  # ==========================================
  # pgAdmin
  # ==========================================
  pgadmin:
    image: dpage/pgadmin4
    container_name: tracker_pgadmin
    restart: unless-stopped

    ports:
      - "8080:80"

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin

    depends_on:
      - database

    networks:
      - app-network

# ==========================================
# Networks
# ==========================================
networks:
  app-network:
    driver: bridge

# ==========================================
# Persistent Volumes
# ==========================================
volumes:
  rabbitmq_data:
